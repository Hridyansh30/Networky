name: Deploy static site
description: >
  Uploads an already built folder to the static host and returns its URL.
  THIS FILE IS THE ONLY HOST-SPECIFIC CODE IN THE PIPELINE. To move to another
  host (Netlify, Vercel, S3 + CloudFront ...) rewrite these steps and keep the
  inputs and outputs the same. docs/ci-cd.md has ready-made replacements.
  Current host: Cloudflare Pages.
inputs:
  dir:
    description: Built folder to upload (already contains _headers)
    required: true
  project:
    description: Project name on the host
    required: true
  production:
    description: "'true' for the live site, 'false' for a preview"
    required: true
  preview-name:
    description: Short, safe name for a preview (e.g. pr-42)
    required: false
    default: preview
  api-token:
    description: Host API token (from a GitHub secret)
    required: true
  account-id:
    description: Host account id
    required: true
outputs:
  url:
    description: URL of this deployment
    value: ${{ steps.url.outputs.url }}
runs:
  using: composite
  steps:
    - name: Pick the Pages branch
      id: branch
      shell: bash
      env:
        PRODUCTION: ${{ inputs.production }}
        PREVIEW_NAME: ${{ inputs.preview-name }}
      run: |
        # Pages treats the project's production branch ("main") as live and
        # any other branch name as a preview with its own stable alias URL.
        if [ "$PRODUCTION" = "true" ]; then echo "name=main" >> "$GITHUB_OUTPUT"
        else echo "name=$PREVIEW_NAME" >> "$GITHUB_OUTPUT"; fi
    - name: Upload to Cloudflare Pages
      id: deploy
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
      with:
        apiToken: ${{ inputs.api-token }}
        accountId: ${{ inputs.account-id }}
        wranglerVersion: '4.152.0'
        command: pages deploy ${{ inputs.dir }} --project-name=${{ inputs.project }} --branch=${{ steps.branch.outputs.name }} --commit-hash=${{ github.sha }} --commit-dirty=true
    - name: Report URL
      id: url
      shell: bash
      env:
        PRODUCTION: ${{ inputs.production }}
        ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        UNIQUE: ${{ steps.deploy.outputs.deployment-url }}
        PROJECT: ${{ inputs.project }}
      run: |
        # Production: the stable project URL (or your custom domain).
        # Preview: the per-PR alias, which stays the same across pushes.
        if [ "$PRODUCTION" = "true" ]; then url="https://$PROJECT.pages.dev"
        else url="${ALIAS:-$UNIQUE}"; fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
